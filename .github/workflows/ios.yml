name: Build iPhone app

# Builds unsigned OldTunes.ipa and OldTunesMusic.ipa on GitHub's Macs and puts them on the "app" release page.
# Install it on the iPhone with Sideloadly (signs it with your own Apple ID).
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build apps (unsigned)
        working-directory: ios
        run: |
          for T in OldTunes OldTunesMusic; do
            xcodebuild -project OldTunes.xcodeproj -target $T -configuration Release -sdk iphoneos \
              SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          done

      - name: Package .ipa files
        working-directory: ios
        run: |
          for T in OldTunes OldTunesMusic; do
            rm -rf Payload && mkdir -p Payload
            cp -R build/Release-iphoneos/$T.app Payload/
            zip -qry $T.ipa Payload
          done
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OldTunes-ipa
          path: ios/*.ipa

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Old Tunes for iPhone" \
            --notes "OldTunes.ipa = Spotify player, OldTunesMusic.ipa = your own music. Install with Sideloadly (see ios/README.md)."
          gh release upload app ios/OldTunes.ipa ios/OldTunesMusic.ipa --clobber
