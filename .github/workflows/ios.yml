name: Build iPhone app

# Builds an unsigned OldTunes.ipa on GitHub's Macs and puts it on the "app" release page.
# Install it on the iPhone with Sideloadly (signs it with your own Apple ID).
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project OldTunes.xcodeproj -target OldTunes -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OldTunes.app Payload/
          zip -qry OldTunes.ipa Payload
          ls -lh OldTunes.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OldTunes-ipa
          path: ios/OldTunes.ipa

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Old Tunes for iPhone" \
            --notes "Download OldTunes.ipa and install it with Sideloadly (see ios/README.md)."
          gh release upload app ios/OldTunes.ipa --clobber
