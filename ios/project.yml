# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run ./setup.sh to generate OldTunes.xcodeproj from this file.
name: OldTunes
options:
  bundleIdPrefix: com.harriparna
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  OldTunes:
    type: application
    platform: iOS
    sources:
      - OldTunes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harriparna.oldtunes
        PRODUCT_NAME: OldTunes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: NO
    info:
      path: OldTunes/Info.plist
      properties:
        CFBundleDisplayName: Old Tunes
        LSRequiresIPhoneOS: true
        LSApplicationQueriesSchemes: [spotify]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
