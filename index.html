<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Old Tunes">
<meta name="theme-color" content="#bdbdbd">
<title>Old Tunes</title>
<style>
:root{
  --font:"Lucida Grande","Lucida Sans Unicode","Helvetica Neue",Helvetica,Arial,sans-serif;
  --metal:linear-gradient(#ececec 0%,#d6d6d6 45%,#c2c2c2 55%,#b3b3b3 100%);
  --src:#d6dde8;
  --sel:linear-gradient(#6f9be0,#3a6fc8);
  --row-alt:#edf3fe;
  --line:#a5a5a5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);font-size:12px;color:#111;background:#9a9a9a;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font-family:inherit;font-size:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:#b8b8b8}

/* ---------- top bar ---------- */
header{background:var(--metal);border-bottom:1px solid #6e6e6e;display:flex;align-items:center;gap:14px;padding:8px 12px;min-height:72px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.transport{display:flex;align-items:center;gap:4px}
.tbtn{width:34px;height:34px;border-radius:50%;border:1px solid #6b6b6b;cursor:pointer;padding:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#ffffff 0%,#e3e3e3 40%,#b9b9b9 75%,#d8d8d8 100%);
  box-shadow:0 1px 1px rgba(255,255,255,.9),inset 0 -1px 2px rgba(0,0,0,.25)}
.tbtn:active,.tbtn.on{background:radial-gradient(circle at 50% 35%,#cfcfcf 0%,#b0b0b0 60%,#9c9c9c 100%)}
.tbtn.big{width:42px;height:42px}
.tbtn svg{width:16px;height:16px;fill:#2a2a2a}
.tbtn.big svg{width:20px;height:20px}
.vol{display:flex;align-items:center;gap:4px}
.vol svg{width:11px;height:11px;fill:#333}
input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:16px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(#7a7a7a,#bdbdbd);border:1px solid #6a6a6a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-6px;border-radius:50%;border:1px solid #555;
  background:radial-gradient(circle at 50% 30%,#fff,#bbb)}
input[type=range]::-moz-range-track{height:4px;background:#999;border:1px solid #6a6a6a;border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;border:1px solid #555;background:#ddd}

.lcd{flex:1;min-width:0;max-width:520px;margin:0 auto;height:54px;border-radius:7px;border:1px solid #6f705f;position:relative;
  background:linear-gradient(#fbfcee 0%,#eef1d8 50%,#dfe3c4 100%);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 44px;color:#22231b;overflow:hidden;user-select:none}
.lcd .l1{font-weight:bold;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lcd .l2{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:pointer}
.lcd .prog{display:flex;align-items:center;gap:6px;width:100%;font-size:10px;margin-top:2px}
.lcd .bar{flex:1;height:7px;border:1px solid #55574a;border-radius:1px;position:relative;cursor:pointer;background:rgba(255,255,255,.4)}
.lcd .fill{position:absolute;left:0;top:0;bottom:0;background:#55574a;opacity:.85}
.lcd .knob{position:absolute;top:50%;width:8px;height:8px;background:#2b2c23;transform:translate(-50%,-50%) rotate(45deg)}
.lcd .idle{font-size:13px;font-weight:bold;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.lcd .idle svg{width:18px;height:18px;fill:#3a3b30}
.lcd .dev{position:absolute;right:7px;top:4px;font-size:9px;color:#5b5d4c;max-width:40px;overflow:hidden;white-space:nowrap}
.search{position:relative}
.search input{width:170px;height:22px;border-radius:11px;border:1px solid #777;padding:0 10px 0 24px;outline:none;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);background:#fff}
.search input:focus{box-shadow:0 0 0 3px rgba(80,140,230,.55),inset 0 1px 2px rgba(0,0,0,.35)}
.search svg{position:absolute;left:8px;top:5px;width:12px;height:12px;fill:#666}
.menubtn{display:none}

/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0;background:#fff}
aside{width:210px;flex:none;background:var(--src);border-right:1px solid #8c929c;display:flex;flex-direction:column;min-height:0}
.srclist{flex:1;overflow-y:auto;padding:6px 0}
.src-h{font-size:11px;font-weight:bold;color:#5c6a82;padding:8px 10px 3px;letter-spacing:.2px;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.srclist ul{list-style:none;margin:0;padding:0}
.srclist li{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 16px;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px}
.srclist li span{overflow:hidden;text-overflow:ellipsis}
.srclist li svg{width:16px;height:16px;flex:none}
.srclist li.sel{background:var(--sel);color:#fff;font-weight:bold;text-shadow:0 1px 0 rgba(0,0,0,.25);border-top:1px solid #5a87d0}
.srclist li .spk{margin-left:auto;width:11px;height:11px;fill:currentColor;opacity:.8}
.art{border-top:1px solid #8c929c;background:#e8e8e8;flex:none}
.art .h{background:var(--metal);font-size:10px;font-weight:bold;color:#444;padding:3px 8px;border-bottom:1px solid #999;cursor:pointer}
.art .img{aspect-ratio:1/1;width:100%;display:grid;place-items:center;color:#888;font-size:11px;background:#e6e6e6}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.collapsed .img{display:none}

main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.tablewrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:1;text-align:left;font-weight:normal;font-size:11px;padding:2px 6px;height:18px;
  background:linear-gradient(#fdfdfd,#e6e6e6 50%,#d7d7d7 51%,#e9e9e9);border-bottom:1px solid #9a9a9a;border-right:1px solid #c3c3c3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;user-select:none}
th.sorted{background:linear-gradient(#cfe0fa,#a9c6f2 50%,#94b8ee 51%,#bcd4f6);font-weight:bold}
th .arr{float:right;font-size:8px;margin-top:2px}
td{padding:1px 6px;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid #e3e3e3;font-size:12px}
tbody tr:nth-child(even) td{background:var(--row-alt)}
tbody tr.sel td{background:#3875d7;color:#fff;border-right-color:#3875d7}
tbody tr.local td{color:#999}
td.num,td.time{text-align:right;color:#555;font-variant-numeric:tabular-nums}
tr.sel td.num,tr.sel td.time{color:#fff}
td.ind svg{width:13px;height:13px;fill:#222;vertical-align:middle}
tr.sel td.ind svg{fill:#fff}
col.c-ind{width:22px}col.c-num{width:40px}col.c-time{width:56px}
.empty{padding:40px 20px;text-align:center;color:#666;line-height:1.6}
.empty b{color:#222}
.aqua{display:inline-block;margin-top:10px;border:1px solid #2c5aa8;border-radius:12px;padding:4px 18px;color:#fff;cursor:pointer;font-weight:bold;
  background:linear-gradient(#a9cdfa 0%,#5c9aee 49%,#3f84ea 50%,#7fb6fb 100%);box-shadow:0 1px 2px rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.aqua.grey{border-color:#777;color:#111;text-shadow:none;background:linear-gradient(#fff 0%,#e6e6e6 49%,#d6d6d6 50%,#f2f2f2 100%)}

/* ---------- bottom bar ---------- */
footer{background:var(--metal);border-top:1px solid #7b7b7b;display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:30px;
  padding-bottom:calc(4px + env(safe-area-inset-bottom))}
.sbtn{height:22px;min-width:28px;border:1px solid #777;border-radius:4px;background:linear-gradient(#fdfdfd,#e2e2e2 50%,#d3d3d3 51%,#ececec);
  display:grid;place-items:center;cursor:pointer;padding:0 6px}
.sbtn svg{width:14px;height:14px;fill:#333}
.sbtn.on{background:linear-gradient(#bcd3f7,#8fb3ec 50%,#7aa5ea 51%,#a8c6f5);border-color:#3e66a8}
.sbtn.on svg{fill:#123c80}
.sbtn .one{font-size:8px;font-weight:bold;margin-left:-3px;color:#123c80}
.status{flex:1;text-align:center;font-size:11px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.devsel{display:flex;align-items:center;gap:4px}
.devsel svg{width:13px;height:13px;fill:#333}
.devsel select{height:20px;max-width:150px;border:1px solid #777;border-radius:4px;background:#f4f4f4}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(30,30,30,.88);color:#fff;
  padding:7px 14px;border-radius:8px;font-size:12px;max-width:min(90vw,460px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}

/* ---------- setup window ---------- */
#setup{position:fixed;inset:0;background:rgba(80,80,80,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#setup.show{display:flex}
.win{width:min(520px,100%);max-height:100%;overflow:auto;background:#ececec;border:1px solid #666;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.win .tb{background:var(--metal);border-bottom:1px solid #777;border-radius:6px 6px 0 0;padding:5px 10px;font-weight:bold;text-align:center;position:relative;color:#333}
.win .tb .dots{position:absolute;left:9px;top:6px;display:flex;gap:6px}
.win .tb .dots i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.35);
  background:radial-gradient(circle at 50% 30%,#fff 0%,#c9c9c9 60%,#a5a5a5 100%)}
.win .c{padding:16px 18px;line-height:1.5}
.win h2{font-size:15px;margin:0 0 8px}
.win ol{padding-left:20px;margin:8px 0}
.win li{margin-bottom:8px}
.win code{background:#fff;border:1px solid #bbb;border-radius:3px;padding:2px 5px;font-size:11px;word-break:break-all;display:inline-block}
.win input[type=text]{width:100%;height:24px;border:1px solid #888;padding:0 6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);margin-top:4px;font-family:Menlo,monospace;font-size:12px}
.win .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.win .warn{background:#fff6cf;border:1px solid #d8c56a;padding:8px;border-radius:4px;margin-bottom:10px}
.win .small{font-size:11px;color:#555}
.win a{color:#1f56b8}

/* ---------- narrow screens (iPhone) ---------- */
@media (max-width:760px){
  header{flex-wrap:wrap;gap:8px;padding:8px}
  .lcd{order:3;flex-basis:100%;max-width:none;height:52px;padding:3px 12px}
  .vol{display:none}
  .transport{order:1}
  .menubtn{display:grid;order:0}
  .search{order:2;margin-left:auto}
  .search input{width:140px}
  aside{position:absolute;z-index:10;top:0;bottom:0;left:0;width:78%;max-width:300px;transform:translateX(-102%);transition:transform .22s;box-shadow:4px 0 16px rgba(0,0,0,.3)}
  aside.open{transform:none}
  .body{position:relative}
  col.c-num,th.num,td.num,col.c-album,th.album,td.album{display:none}
  td{height:30px;font-size:13px}
  .srclist li{padding:7px 12px 7px 16px;font-size:13px}
  #scrim{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:9;display:none}
  aside.open+#scrim{display:block}
  .devsel select{max-width:120px}
}
::-webkit-scrollbar{width:15px;height:15px}
::-webkit-scrollbar-track{background:linear-gradient(90deg,#d8d8d8,#f3f3f3);border-left:1px solid #c6c6c6}
::-webkit-scrollbar-thumb{border-radius:8px;border:3px solid transparent;background-clip:padding-box;
  background-color:#6f9be0;background-image:linear-gradient(90deg,#9fc1f3,#4a7fd6 50%,#7aa8ec)}
@media (pointer:coarse){::-webkit-scrollbar{width:0;height:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M11 12l9-7v14zM2 12l9-7v14z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M13 12L4 5v14zm9 0l-9-7v14z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M5 3h5v18H5zm9 0h5v18h-5z"/></symbol>
  <symbol id="i-spk" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3z"/><path d="M15 7v2.2a3 3 0 010 5.6V17a5 5 0 000-10z"/></symbol>
  <symbol id="i-spklo" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3z"/></symbol>
  <symbol id="i-spkhi" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3z"/><path d="M15 8.5a5 5 0 010 7M18 5.5a9 9 0 010 13" fill="none" stroke="#333" stroke-width="2"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 3v11.3A3.5 3.5 0 1011 17V7l9-2v7.3A3.5 3.5 0 1022 15V1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10 2a8 8 0 016.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.5l-7 9H3v-2h3.5l7-9H17zM3 7h4.5l2 2.6-1.3 1.6L6.5 9H3zm12.5 8H17v-3l4 4-4 4v-3h-2.5l-2.3-3 1.3-1.6z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10V4l4 4-4 4V9H7v4H5V9a2 2 0 012-2zm10 10H7v3l-4-4 4-4v3h10v-4h2v4a2 2 0 01-2 2z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zm0 5.75h18v2.5H3zm0 5.75h18V19H3z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M10 3h9a2 2 0 012 2v14a2 2 0 01-2 2h-9v-2h9V5h-9zm-1 5l1.4 1.4L8.8 11H16v2H8.8l1.6 1.6L9 16l-4-4z"/></symbol>
  <symbol id="i-pl" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="#6f8fc7" stroke="#3d5d98"/><path d="M4 5h5M4 8h5M4 11h3" stroke="#fff" stroke-width="1.3"/><path d="M11 4.5v5.2a1.4 1.4 0 11-.9-1.3V4.5z" fill="#fff"/></symbol>
  <symbol id="i-plshared" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="#9aa7bd" stroke="#5f6b80"/><path d="M4 5h5M4 8h5M4 11h3" stroke="#fff" stroke-width="1.3"/><path d="M11 4.5v5.2a1.4 1.4 0 11-.9-1.3V4.5z" fill="#fff"/></symbol>
  <symbol id="i-lib" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="#5f9be6" stroke="#2f62ad"/><path d="M6 4v6.2A1.6 1.6 0 107 11.6V6.2l4.5-1v4A1.6 1.6 0 1012.5 10.6V3z" fill="#fff"/></symbol>
</svg>

<div id="app">
  <header>
    <button class="tbtn menubtn" id="menuBtn" title="Playlists" aria-label="Playlists"><svg><use href="#i-menu"/></svg></button>
    <div class="transport">
      <button class="tbtn" id="prevBtn" title="Previous" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="tbtn big" id="playBtn" title="Play" aria-label="Play"><svg><use id="playIcon" href="#i-play"/></svg></button>
      <button class="tbtn" id="nextBtn" title="Next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
    </div>
    <div class="vol">
      <svg><use href="#i-spklo"/></svg>
      <input type="range" id="vol" min="0" max="100" value="60" aria-label="Volume">
      <svg><use href="#i-spkhi"/></svg>
    </div>
    <div class="lcd" id="lcd"></div>
    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input type="search" id="search" placeholder="Search" autocomplete="off" aria-label="Filter songs">
    </div>
  </header>

  <div class="body">
    <aside id="side">
      <div class="srclist">
        <div class="src-h">Library</div>
        <ul id="lib"></ul>
        <div class="src-h">Playlists</div>
        <ul id="pls"></ul>
      </div>
      <div class="art" id="art"><div class="h" id="artH">Now Playing</div><div class="img" id="artImg">Nothing playing</div></div>
    </aside>
    <div id="scrim"></div>
    <main>
      <div class="tablewrap" id="tw">
        <table>
          <colgroup><col class="c-ind"><col class="c-num"><col class="c-name"><col class="c-time"><col class="c-artist"><col class="c-album"></colgroup>
          <thead><tr>
            <th class="ind"></th><th class="num" data-k="n">#</th><th data-k="name">Name</th><th class="time" data-k="dur">Time</th><th data-k="artist">Artist</th><th class="album" data-k="album">Album</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="notice"></div>
      </div>
    </main>
  </div>

  <footer>
    <button class="sbtn" id="shufBtn" title="Shuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
    <button class="sbtn" id="repBtn" title="Repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    <div class="status" id="status"></div>
    <div class="devsel" title="Play on"><svg><use href="#i-spk"/></svg><select id="dev" aria-label="Play on device"></select></div>
    <button class="sbtn" id="outBtn" title="Log out" aria-label="Log out"><svg><use href="#i-out"/></svg></button>
  </footer>
</div>

<div id="toast"></div>

<div id="setup">
  <div class="win">
    <div class="tb"><div class="dots"><i></i><i></i><i></i></div>Welcome to Old Tunes</div>
    <div class="c" id="setupC"></div>
  </div>
</div>

<script>
/* =========================================================
   Old Tunes — a plain, playlists-only Spotify player.
   Optional: paste your Spotify Client ID here to skip the setup box.
   ========================================================= */
const CONFIG = { clientId: "" };

const API = "https://api.spotify.com/v1";
const SCOPES = [
  "playlist-read-private","playlist-read-collaborative","user-library-read",
  "user-read-playback-state","user-modify-playback-state","user-read-currently-playing",
  "streaming","user-read-private","user-read-email"
].join(" ");
const REDIRECT = location.origin + location.pathname;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const fmt = ms => { if (!(ms >= 0)) return ""; const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const coarse = window.matchMedia && matchMedia("(pointer:coarse)").matches;

const st = {
  demo: location.hash === "#demo",
  me: null, playlists: [], current: null, cache: {},
  sort: { key: null, dir: 1 }, filter: "", selected: null,
  player: null, playerAt: 0, devices: [], deviceId: store.get("ot_device") || null,
  sdk: null, sdkDevice: null, lineToggle: 0
};
let tok = null;
try { tok = JSON.parse(store.get("ot_token") || "null"); } catch(e) {}

function clientId(){ return CONFIG.clientId || store.get("ot_client_id") || ""; }

let toastT;
function toast(msg, ms=3500){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), ms); }

/* ---------------- auth (PKCE) ---------------- */
function randStr(n){ const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b=>c[b%c.length]).join(""); }
async function challenge(v){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const id = clientId();
  if (!id) return showSetup();
  const verifier = randStr(64), state = randStr(16);
  store.set("ot_verifier", verifier); store.set("ot_state", state);
  const q = new URLSearchParams({ client_id:id, response_type:"code", redirect_uri:REDIRECT, scope:SCOPES,
    code_challenge_method:"S256", code_challenge: await challenge(verifier), state });
  location.href = "https://accounts.spotify.com/authorize?" + q;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:new URLSearchParams(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error_description || j.error || ("Sign-in failed (" + r.status + ")"));
  tok = { access:j.access_token, refresh:j.refresh_token || (tok && tok.refresh), exp: Date.now() + j.expires_in*1000 };
  store.set("ot_token", JSON.stringify(tok));
  return tok;
}
async function handleCallback(){
  const p = new URLSearchParams(location.search);
  if (!p.has("code") && !p.has("error")) return false;
  history.replaceState(null, "", location.pathname);
  if (p.get("error")) { showSetup("Spotify said: " + p.get("error")); return true; }
  if (p.get("state") !== store.get("ot_state")) { showSetup("Sign-in was interrupted (state mismatch). Try again."); return true; }
  try {
    await tokenRequest({ grant_type:"authorization_code", code:p.get("code"), redirect_uri:REDIRECT,
      client_id:clientId(), code_verifier:store.get("ot_verifier") });
  } catch(e) { showSetup(e.message); return true; }
  store.del("ot_verifier"); store.del("ot_state");
  return false;
}
let refreshing = null;
async function getToken(){
  if (!tok) throw new Error("Not signed in");
  if (Date.now() > tok.exp - 60000) {
    refreshing = refreshing || tokenRequest({ grant_type:"refresh_token", refresh_token:tok.refresh, client_id:clientId() })
      .catch(e => { logout(true); throw e; }).finally(()=>{ refreshing = null; });
    await refreshing;
  }
  return tok.access;
}
function logout(silent){
  tok = null; store.del("ot_token");
  if (st.sdk) { try { st.sdk.disconnect(); } catch(e){} }
  showSetup(silent ? "Your Spotify sign-in expired. Connect again." : "");
}

/* ---------------- API ---------------- */
async function api(path, { method="GET", body } = {}, retry=true){
  if (st.demo) return null;
  const url = path.startsWith("http") ? path : API + path;
  const headers = { Authorization: "Bearer " + await getToken() };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (r.status === 401 && retry) { tok.exp = 0; return api(path, { method, body }, false); }
  if (r.status === 429 && retry) { await sleep((+(r.headers.get("Retry-After")) || 2) * 1000); return api(path, { method, body }, false); }
  if (r.status === 204 || r.status === 202) return null;
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) {
    const e = new Error((j && j.error && (j.error.message || j.error)) || ("HTTP " + r.status));
    e.status = r.status; e.reason = j && j.error && j.error.reason; throw e;
  }
  return j;
}

/* ---------------- library ---------------- */
function bestImg(imgs, small){ if (!imgs || !imgs.length) return ""; const s=[...imgs].sort((a,b)=>(a.width||0)-(b.width||0)); return (small ? s.find(i=>(i.width||0)>=64) : s[s.length-1] ) ?.url || s[s.length-1].url; }
function norm(t, i){
  if (!t) return null;
  const artists = t.artists || (t.show ? [t.show] : []);
  return { n:i+1, uri:t.uri, name:t.name || "(untitled)", artist:artists.map(a=>a.name).join(", "),
    album: t.album ? t.album.name : (t.show ? t.show.name : ""), dur:t.duration_ms,
    img: bestImg(t.album ? t.album.images : (t.images || [])), local: !!t.is_local || !t.uri };
}

async function loadMe(){ st.me = await api("/me"); }
async function loadPlaylists(){
  let url = "/me/playlists?limit=50";
  st.playlists = [];
  while (url) {
    const j = await api(url); if (!j) break;
    for (const p of j.items || []) if (p) st.playlists.push(p);
    renderSide(); url = j.next;
  }
}
function plReadable(p){ return p.owner && st.me && (p.owner.id === st.me.id || p.collaborative); }
function plTotal(p){ const t = p.items || p.tracks; return t && typeof t.total === "number" ? t.total : null; }

async function openSource(src){
  st.current = src; st.selected = null; st.sort = { key:null, dir:1 };
  $("#search").value = ""; st.filter = "";
  store.set("ot_last", src.id);
  closeSide(); renderSide(); renderTable();
  $("#tw").scrollTop = 0;
  if (src.kind === "playlist" && !src.readable) return;
  if (src.loaded || src.loading) return;
  src.loading = true; src.tracks = []; renderTable();
  try {
    let url = src.kind === "liked" ? "/me/tracks?limit=50" : `/playlists/${src.id}/items?limit=50`;
    while (url) {
      const j = await api(url); if (!j) break;
      for (const it of j.items || []) {
        const t = norm(it.item || it.track, src.tracks.length);
        if (t) src.tracks.push(t);
      }
      url = j.next;
      if (st.current === src) renderTable();
    }
    src.loaded = true;
  } catch(e) {
    if (e.status === 403 || e.status === 404) src.readable = false;
    else toast("Couldn't load songs: " + e.message);
  } finally { src.loading = false; if (st.current === src) renderTable(); }
}
function sourceFor(id){
  if (st.cache[id]) return st.cache[id];
  let src;
  if (id === "liked") src = { id, kind:"liked", name:"Liked Songs", uri: st.me ? `spotify:user:${st.me.id}:collection` : null, readable:true, tracks:[] };
  else {
    const p = st.playlists.find(x => x.id === id); if (!p) return null;
    src = { id, kind:"playlist", name:p.name, uri:p.uri, readable: plReadable(p), owner:p.owner && (p.owner.display_name || p.owner.id), total:plTotal(p), tracks:[] };
  }
  return (st.cache[id] = src);
}

/* ---------------- rendering ---------------- */
function renderSide(){
  const cur = st.current && st.current.id;
  const playingCtx = st.player && st.player.context && st.player.context.uri;
  const li = (id, icon, name) => {
    const src = st.cache[id]; const playing = playingCtx && src && src.uri === playingCtx && st.player.is_playing;
    return `<li data-id="${esc(id)}" class="${id===cur?"sel":""}"><svg><use href="#${icon}"/></svg><span>${esc(name)}</span>${playing?'<svg class="spk"><use href="#i-spk"/></svg>':""}</li>`;
  };
  $("#lib").innerHTML = li("liked","i-lib","Liked Songs");
  $("#pls").innerHTML = st.playlists.map(p => { sourceFor(p.id); return li(p.id, plReadable(p) ? "i-pl" : "i-plshared", p.name); }).join("")
    || `<li style="color:#667">${tok || st.demo ? "Loading…" : ""}</li>`;
}
function currentView(){
  const src = st.current; if (!src) return [];
  let v = src.tracks;
  const f = st.filter.trim().toLowerCase();
  if (f) v = v.filter(t => (t.name+" "+t.artist+" "+t.album).toLowerCase().includes(f));
  const { key, dir } = st.sort;
  if (key) v = [...v].sort((a,b) => {
    const x = a[key], y = b[key];
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, { sensitivity:"base" })) * dir;
  });
  return v;
}
function renderTable(){
  const src = st.current, rows = $("#rows"), notice = $("#notice");
  document.querySelectorAll("th[data-k]").forEach(th => {
    const on = th.dataset.k === st.sort.key;
    th.classList.toggle("sorted", on);
    th.innerHTML = th.innerHTML.replace(/<span class="arr">.*?<\/span>/, "") + (on ? `<span class="arr">${st.sort.dir>0?"▲":"▼"}</span>` : "");
  });
  if (!src) { rows.innerHTML = ""; notice.innerHTML = `<div class="empty">Pick a playlist on the left.</div>`; renderStatus(); return; }
  if (src.kind === "playlist" && !src.readable) {
    rows.innerHTML = "";
    notice.innerHTML = `<div class="empty"><b>${esc(src.name)}</b>${src.owner?`<br>by ${esc(src.owner)}`:""}<br><br>
      Spotify only lets personal apps list the songs in playlists you made or collaborate on.<br>You can still play this one.<br>
      <span class="aqua" data-act="playctx">▶ Play playlist</span> <span class="aqua grey" data-act="shufctx">Shuffle</span></div>`;
    renderStatus(); return;
  }
  const view = currentView();
  const playingUri = st.player && st.player.item && st.player.item.uri;
  rows.innerHTML = view.map(t => `<tr data-n="${t.n}" class="${t.n===st.selected?"sel":""}${t.local?" local":""}">
    <td class="ind">${t.uri && t.uri===playingUri ? `<svg><use href="#${st.player.is_playing?"i-spk":"i-pause"}"/></svg>` : ""}</td>
    <td class="num">${t.n}</td><td>${esc(t.name)}</td><td class="time">${fmt(t.dur)}</td><td>${esc(t.artist)}</td><td class="album">${esc(t.album)}</td></tr>`).join("");
  notice.innerHTML = src.loading && !src.tracks.length ? `<div class="empty">Loading songs…</div>`
    : (!view.length ? `<div class="empty">${st.filter ? "No songs match." : "This playlist is empty."}</div>` : "");
  renderStatus();
}
function renderStatus(){
  const src = st.current;
  if (!src) { $("#status").textContent = ""; return; }
  if (src.kind === "playlist" && !src.readable) { $("#status").textContent = src.total != null ? `${src.total} songs` : ""; return; }
  const v = currentView(); const ms = v.reduce((a,t)=>a+(t.dur||0),0);
  const h = ms/3600000;
  const time = h >= 1 ? `${h.toFixed(1)} hours` : `${Math.round(ms/60000)} minutes`;
  $("#status").textContent = `${v.length} song${v.length===1?"":"s"}, ${time}${src.loading?" — loading…":""}`;
}

/* ---------------- LCD / now playing ---------------- */
function progressNow(){
  const p = st.player; if (!p || !p.item) return 0;
  const ms = p.progress_ms + (p.is_playing ? Date.now() - st.playerAt : 0);
  return Math.max(0, Math.min(ms, p.item.duration_ms || ms));
}
let lastLcdKey = "";
function renderLcd(){
  const p = st.player, lcd = $("#lcd");
  if (!p || !p.item) {
    const key = "idle";
    if (lastLcdKey !== key) { lcd.innerHTML = `<div class="idle"><svg><use href="#i-note"/></svg>Old Tunes</div>`; lastLcdKey = key; }
    $("#playIcon").setAttribute("href", "#i-play");
    return;
  }
  const it = p.item;
  const artists = (it.artists || (it.show ? [it.show] : [])).map(a=>a.name).join(", ");
  const album = it.album ? it.album.name : (it.show ? it.show.name : "");
  const line2 = (st.lineToggle % 2 === 0 || !album) ? artists : album;
  const key = it.uri + "|" + line2 + "|" + (p.device && p.device.name);
  if (lastLcdKey !== key) {
    lcd.innerHTML = `<div class="l1">${esc(it.name)}</div><div class="l2" id="l2">${esc(line2)}</div>
      <div class="prog"><span id="el">0:00</span><div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div><span id="rem"></span></div>`;
    lastLcdKey = key;
  }
  const pos = progressNow(), dur = it.duration_ms || 1, pct = Math.min(100, pos/dur*100);
  $("#el").textContent = fmt(pos); $("#rem").textContent = "-" + fmt(dur - pos);
  $("#fill").style.width = pct + "%"; $("#knob").style.left = pct + "%";
  $("#playIcon").setAttribute("href", p.is_playing ? "#i-pause" : "#i-play");
}
let lastArt = null;
function renderNowPlaying(){
  const p = st.player;
  const img = p && p.item ? bestImg(p.item.album ? p.item.album.images : (p.item.images || [])) : "";
  if (img !== lastArt) { lastArt = img; $("#artImg").innerHTML = img ? `<img src="${esc(img)}" alt="">` : "Nothing playing"; }
  $("#shufBtn").classList.toggle("on", !!(p && p.shuffle_state));
  const rep = p ? p.repeat_state : "off";
  $("#repBtn").classList.toggle("on", rep && rep !== "off");
  $("#repBtn").innerHTML = `<svg><use href="#i-repeat"/></svg>${rep === "track" ? '<span class="one">1</span>' : ""}`;
  if (p && p.device && typeof p.device.volume_percent === "number" && !volDragging) $("#vol").value = p.device.volume_percent;
  lastLcdKey = ""; renderLcd(); renderSide();
  if (st.current && st.current.tracks.length) renderTable();
}
function setPlayer(p){
  const prevKey = st.player && st.player.item ? st.player.item.uri + st.player.is_playing : "";
  st.player = p; st.playerAt = Date.now();
  if (p && p.device && p.device.id && !st.deviceId) st.deviceId = p.device.id;
  const key = p && p.item ? p.item.uri + p.is_playing : "";
  if (key !== prevKey) renderNowPlaying(); else { renderLcd(); $("#shufBtn").classList.toggle("on", !!(p && p.shuffle_state)); }
}
async function refreshPlayer(){
  if (st.demo || !tok) return;
  try { const p = await api("/me/player?additional_types=episode"); setPlayer(p && p.item ? p : (p || null)); } catch(e) {}
}
let soonT; function soon(){ clearTimeout(soonT); soonT = setTimeout(refreshPlayer, 450); }

/* ---------------- devices ---------------- */
async function loadDevices(){
  if (st.demo) { st.devices = [{ id:"demo", name:"This computer", is_active:true }]; renderDevices(); return; }
  try { const j = await api("/me/player/devices"); st.devices = (j && j.devices) || []; } catch(e) { st.devices = []; }
  renderDevices();
}
function renderDevices(){
  const sel = $("#dev");
  const active = st.devices.find(d => d.is_active);
  if (!st.deviceId || !st.devices.some(d => d.id === st.deviceId)) st.deviceId = (active && active.id) || st.sdkDevice || (st.devices[0] && st.devices[0].id) || null;
  sel.innerHTML = st.devices.length
    ? st.devices.map(d => `<option value="${esc(d.id)}" ${d.id===st.deviceId?"selected":""}>${esc(d.id===st.sdkDevice ? "This browser" : d.name)}</option>`).join("")
    : `<option value="">No devices — open Spotify</option>`;
}
async function ensureDevice(){
  if (st.deviceId && st.devices.some(d => d.id === st.deviceId)) return st.deviceId;
  await loadDevices();
  return st.deviceId;
}

/* ---------------- playback control ---------------- */
function noDevice(){ toast("No Spotify device found. Open the Spotify app on your phone or computer, then pick it under the speaker menu at the bottom.", 6000); loadDevices(); }
function activateSdk(){ if (st.sdk && st.deviceId === st.sdkDevice) { try { st.sdk.activateElement(); } catch(e){} } }

async function play(body){
  if (st.demo) return demoPlay(body);
  const id = await ensureDevice();
  if (!id) return noDevice();
  try { await api("/me/player/play?device_id=" + encodeURIComponent(id), { method:"PUT", body: body || {} }); }
  catch(e) {
    if (e.status === 404) { st.deviceId = null; return noDevice(); }
    if (e.status === 403) return toast("Spotify refused: " + e.message + (e.reason==="PREMIUM_REQUIRED" ? " (Premium needed)" : ""));
    return toast("Couldn't play: " + e.message);
  }
  soon();
}
async function cmd(method, path, local){
  if (st.demo) return;
  if (local && st.sdk && st.player && st.player.device && st.player.device.id === st.sdkDevice) { try { await local(); soon(); return; } catch(e){} }
  try { await api(path, { method }); } catch(e) { if (e.status === 404) return noDevice(); toast(e.message); }
  soon();
}
function playTrackN(n){
  const src = st.current; if (!src) return;
  const t = src.tracks.find(x => x.n === n); if (!t) return;
  if (t.local) return toast("Local files can't be played here.");
  activateSdk();
  const view = currentView().filter(x => !x.local);
  if (src.kind === "playlist" && !st.filter && !st.sort.key) play({ context_uri:src.uri, offset:{ uri:t.uri } });
  else { const i = view.indexOf(t); play({ uris: view.slice(i, i+100).map(x => x.uri) }); }
}
async function playContext(shuffle){
  const src = st.current; if (!src) return;
  activateSdk();
  if (shuffle) { await ensureDevice(); if (st.deviceId) await api(`/me/player/shuffle?state=true&device_id=${encodeURIComponent(st.deviceId)}`, { method:"PUT" }).catch(()=>{}); }
  if (src.kind === "playlist") play({ context_uri: src.uri });
  else { const v = currentView().filter(x=>!x.local); play({ uris: v.slice(0,100).map(x=>x.uri) }); }
}
function togglePlay(){
  activateSdk();
  const p = st.player;
  if (st.demo) { if (p) { p.progress_ms = progressNow(); p.is_playing = !p.is_playing; setPlayer(p); } else demoPlay(); return; }
  if (p && p.is_playing) return cmd("PUT", "/me/player/pause", () => st.sdk.pause());
  if (p && p.item) return play(null);
  if (st.selected) return playTrackN(st.selected);
  if (st.current) return playContext(false);
}

/* ---------------- Web Playback SDK (desktop browsers) ---------------- */
function initSdk(){
  if (isMobile || st.demo) return;
  window.onSpotifyWebPlaybackSDKReady = () => {
    const player = new Spotify.Player({ name:"Old Tunes", volume:(+$("#vol").value)/100, getOAuthToken: cb => getToken().then(cb).catch(()=>{}) });
    player.addListener("ready", ({ device_id }) => { st.sdk = player; st.sdkDevice = device_id; setTimeout(loadDevices, 800); });
    player.addListener("not_ready", () => { st.sdkDevice = null; });
    ["initialization_error","authentication_error","account_error"].forEach(ev =>
      player.addListener(ev, ({ message }) => { st.sdk = null; console.warn(ev, message); }));
    player.addListener("player_state_changed", s => {
      if (!s) return;
      const t = s.track_window && s.track_window.current_track;
      setPlayer({ item: t ? { name:t.name, uri:t.uri, duration_ms:s.duration || t.duration_ms, artists:t.artists, album:t.album } : null,
        is_playing: !s.paused, progress_ms: s.position, shuffle_state: s.shuffle,
        repeat_state: ["off","context","track"][s.repeat_mode] || "off",
        context: s.context && s.context.uri ? { uri:s.context.uri } : null,
        device: { id: st.sdkDevice, name:"This browser", volume_percent: +$("#vol").value } });
    });
    player.connect();
  };
  const sc = document.createElement("script"); sc.src = "https://sdk.scdn.co/spotify-player.js"; sc.async = true;
  sc.onerror = () => console.warn("Web Playback SDK unavailable; remote mode only.");
  document.head.appendChild(sc);
}

/* ---------------- setup window ---------------- */

  const fileMode = !/^https?:$/.test(location.protocol) || location.origin === "null";
  $("#setupC").innerHTML = `
    ${err ? `<div class="warn">${esc(err)}</div>` : ""}
    ${fileMode ? `<div class="warn"><b>Open this page from a web address.</b> Right now it's opened as a file or inside a preview, so there's no address Spotify can accept. Put it online first (e.g. GitHub Pages), then open that https:// link in Safari or Chrome.</div>` : ""}
    <h2>Just your playlists. Nothing else.</h2>
    <p class="small">Old Tunes talks to Spotify directly from your browser. Spotify needs a free "Client ID" for that. It's a one-time, 2-minute step. A Spotify Premium account is required.</p>
    <ol>
      <li>Open <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>, log in, and press <b>Create app</b>. Any name works.</li>
      <li>Under <b>Redirect URIs</b>, add exactly:<br>
        ${fileMode ? `<i>(appears here once the page is opened from its https:// address)</i>` : `<div class="row"><code id="ru">${esc(REDIRECT)}</code> <span class="aqua grey" id="copyRu" style="margin-top:4px">Copy</span></div>`}</li>
      <li>Tick <b>Web API</b> and <b>Web Playback SDK</b>, save, then copy the <b>Client ID</b> and paste it here:
        <input type="text" id="cid" placeholder="e.g. 3f9a0c…" value="${esc(clientId())}" autocomplete="off" spellcheck="false"></li>
    </ol>
    <div style="text-align:right"><span class="aqua" id="goBtn">Connect to Spotify</span></div>`;
  $("#setup").classList.add("show");
  if ($("#copyRu")) $("#copyRu").onclick = () => navigator.clipboard.writeText(REDIRECT).then(()=>toast("Copied")).catch(()=>toast("Select the address and copy it manually."));
  $("#goBtn").onclick = () => {
    if (fileMode) return toast("Open this page from its https:// address first.");
    const v = $("#cid").value.trim();
    if (!/^[0-9a-f]{32}$/i.test(v)) return toast("That doesn't look like a Client ID (32 letters/numbers).");
    store.set("ot_client_id", v); login();
  };
}

/* ---------------- events ---------------- */
function bind(){
  $("#playBtn").onclick = togglePlay;
  $("#prevBtn").onclick = () => { activateSdk(); if (progressNow() > 3000) return seekTo(0); cmd("POST", "/me/player/previous", () => st.sdk.previousTrack()); };
  $("#nextBtn").onclick = () => { activateSdk(); cmd("POST", "/me/player/next", () => st.sdk.nextTrack()); };
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  $("#scrim").onclick = closeSide;
  $("#outBtn").onclick = () => { if (st.demo) return toast("Demo mode"); logout(false); };
  $("#artH").onclick = () => $("#art").classList.toggle("collapsed");

  const sideClick = e => { const li = e.target.closest("li[data-id]"); if (!li) return; const s = sourceFor(li.dataset.id); if (s) openSource(s); };
  $("#lib").onclick = sideClick; $("#pls").onclick = sideClick;

  const rows = $("#rows");
  rows.addEventListener("click", e => {
    const tr = e.target.closest("tr"); if (!tr) return;
    st.selected = +tr.dataset.n;
    rows.querySelectorAll("tr.sel").forEach(x => x.classList.remove("sel")); tr.classList.add("sel");
    if (coarse) playTrackN(st.selected);
  });
  rows.addEventListener("dblclick", e => { const tr = e.target.closest("tr"); if (tr && !coarse) playTrackN(+tr.dataset.n); });
  $("#notice").addEventListener("click", e => {
    const a = e.target.closest("[data-act]"); if (!a) return;
    playContext(a.dataset.act === "shufctx");
  });
  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (st.sort.key === k) { if (st.sort.dir === 1) st.sort.dir = -1; else st.sort = { key:null, dir:1 }; }
    else st.sort = { key: k === "n" ? null : k, dir:1 };
    renderTable();
  });
  $("#search").addEventListener("input", e => { st.filter = e.target.value; renderTable(); });

  $("#lcd").addEventListener("click", e => {
    if (e.target.closest("#bar")) {
      const r = $("#bar").getBoundingClientRect(); const p = st.player;
      if (p && p.item) seekTo(Math.round((e.clientX - r.left) / r.width * p.item.duration_ms));
    } else if (e.target.closest("#l2")) { st.lineToggle++; renderLcd(); }
  });

  let volT;
  $("#vol").addEventListener("pointerdown", () => volDragging = true);
  $("#vol").addEventListener("pointerup", () => setTimeout(()=>volDragging=false, 1500));
  $("#vol").addEventListener("input", e => {
    const v = +e.target.value;
    if (st.sdk && st.player && st.player.device && st.player.device.id === st.sdkDevice) { st.sdk.setVolume(v/100); return; }
    clearTimeout(volT); volT = setTimeout(() => api(`/me/player/volume?volume_percent=${v}`, { method:"PUT" }).catch(()=>{}), 250);
  });

  $("#shufBtn").onclick = () => {
    const on = !(st.player && st.player.shuffle_state);
    if (st.player) st.player.shuffle_state = on; $("#shufBtn").classList.toggle("on", on);
    cmd("PUT", `/me/player/shuffle?state=${on}`);
  };
  $("#repBtn").onclick = () => {
    const order = ["off","context","track"]; const cur = (st.player && st.player.repeat_state) || "off";
    const next = order[(order.indexOf(cur)+1) % 3];
    if (st.player) { st.player.repeat_state = next; renderNowPlaying(); }
    cmd("PUT", `/me/player/repeat?state=${next}`);
  };

  const dev = $("#dev");
  dev.addEventListener("focus", loadDevices);
  dev.addEventListener("change", async () => {
    st.deviceId = dev.value || null; store.set("ot_device", st.deviceId || "");
    if (!st.deviceId || st.demo) return;
    activateSdk();
    try { await api("/me/player", { method:"PUT", body:{ device_ids:[st.deviceId], play: !!(st.player && st.player.is_playing) } }); soon(); }
    catch(e) { toast("Couldn't switch: " + e.message); }
  });

  document.addEventListener("keydown", e => {
    if (e.target.matches("input,select,textarea")) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.key === "Enter" && st.selected) playTrackN(st.selected);
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const v = currentView(); if (!v.length) return; e.preventDefault();
      let i = v.findIndex(t => t.n === st.selected); i = e.key === "ArrowDown" ? Math.min(v.length-1, i+1) : Math.max(0, i-1);
      st.selected = v[i].n; renderTable();
      const tr = $(`#rows tr[data-n="${st.selected}"]`); if (tr) tr.scrollIntoView({ block:"nearest" });
    } else if (e.key === "ArrowRight" && (e.metaKey || e.ctrlKey)) $("#nextBtn").click();
    else if (e.key === "ArrowLeft" && (e.metaKey || e.ctrlKey)) $("#prevBtn").click();
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshPlayer(); });
}
let volDragging = false;
function seekTo(ms){
  if (!st.player) return;
  st.player.progress_ms = ms; st.playerAt = Date.now(); renderLcd();
  cmd("PUT", `/me/player/seek?position_ms=${ms}`, () => st.sdk.seek(ms));
}

/* ---------------- demo (#demo) ---------------- */
function demoData(){
  st.me = { id:"me", display_name:"Me" };
  const pl = (id, name, own=true) => ({ id, name, uri:"spotify:playlist:"+id, owner:{ id: own ? "me" : "someone", display_name: own ? "Me" : "Someone" }, items:{ total:12 } });
  st.playlists = [pl("p1","Driving at Night"), pl("p2","Sunday Morning"), pl("p3","Gym"), pl("p4","Old Favourites"), pl("p5","Friend's Mix", false)];
  const songs = [["Blue Hour","The Lamplighters","Afterglow",241],["Paper Planes Over Tartu","Northern Lines","Coastal",198],["Late Train","Mira Vale","City Lights",263],
    ["Static Hearts","The Lamplighters","Afterglow",217],["Slow Motion Summer","Kesk","Kesk",305],["Glass Harbour","Northern Lines","Coastal",188],
    ["Lighthouse Radio","Mira Vale","City Lights",276],["Wintergarden","Kesk","Kesk",233],["Copper Sky","Hollow Pines","Field Notes",251],
    ["Ninety-Nine Miles","Hollow Pines","Field Notes",199],["Neon Lullaby","The Lamplighters","Afterglow",222],["Morning Ferry","Mira Vale","City Lights",290]];
  for (const p of st.playlists) {
    const s = sourceFor(p.id); s.loaded = true;
    s.tracks = songs.map((x,i) => ({ n:i+1, uri:"spotify:track:"+p.id+i, name:x[0], artist:x[1], album:x[2], dur:x[3]*1000, img:"" }));
  }
  const l = sourceFor("liked"); l.loaded = true; l.tracks = st.cache.p1.tracks.slice(0,8);
}
function demoPlay(body){
  const src = st.current; let t = src && src.tracks[0];
  if (body && body.offset) t = src.tracks.find(x => x.uri === body.offset.uri) || t;
  if (body && body.uris) t = src.tracks.find(x => x.uri === body.uris[0]) || t;
  if (!t) return;
  setPlayer({ item:{ name:t.name, uri:t.uri, duration_ms:t.dur, artists:[{ name:t.artist }], album:{ name:t.album, images:[] } },
    is_playing:true, progress_ms:42000, shuffle_state:false, repeat_state:"off", context:{ uri:src.uri }, device:{ id:"demo", name:"This computer", volume_percent:60 } });
}

/* ---------------- start ---------------- */
async function start(){
  bind();
  renderSide(); renderLcd();
  setInterval(renderLcd, 250);
  setInterval(() => { st.lineToggle++; }, 5000);

  if (st.demo) {
    demoData(); renderSide(); loadDevices();
    openSource(sourceFor("p1")); st.selected = 3; demoPlay({ offset:{ uri: st.cache.p1.tracks[2].uri } });
    return;
  }
  const stop = await handleCallback();
  if (stop) return;
  if (!tok) return showSetup();
  $("#setup").classList.remove("show");
  try { await loadMe(); }
  catch(e) { if (e.status === 403) return showSetup("Spotify blocked access (" + e.message + "). Check that this Spotify account is Premium and is the one that created the app, or is added under User Management in the dashboard."); return toast("Couldn't reach Spotify: " + e.message); }
  sourceFor("liked");
  initSdk();
  refreshPlayer(); loadDevices();
  setInterval(() => { if (!document.hidden) refreshPlayer(); }, 3000);
  await loadPlaylists().catch(e => toast("Couldn't load playlists: " + e.message));
  const last = store.get("ot_last");
  openSource(sourceFor(last) || sourceFor(st.playlists.find(plReadable)?.id) || sourceFor("liked"));
}
start();
</script>
